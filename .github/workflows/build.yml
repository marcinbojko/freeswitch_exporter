---
name: Build

on:
  push:
    branches: [main, master]
    tags: ["[0-9]*", "v*"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: netbsd, goarch: amd64 }
          - { goos: netbsd, goarch: arm64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: openbsd, goarch: arm64 }
          - { goos: solaris, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Get version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Get project dependencies
        run: go mod download

      - name: Build freeswitch_exporter
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o freeswitch_exporter

      - name: Package
        run: |
          mkdir -p dist
          zip -j "dist/freeswitch_exporter-${{ matrix.goos }}-${{ matrix.goarch }}.zip" freeswitch_exporter

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: freeswitch_exporter-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/freeswitch_exporter-${{ matrix.goos }}-${{ matrix.goarch }}.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.zip > SHA256SUMS

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Docker image

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/freeswitch_exporter:${{ github.ref_name }}
            ```
          files: |
            dist/*.zip
            dist/SHA256SUMS
